<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Golden Section Palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   GOLDEN SECTION PALETTE — Web Component v3
   Edit :root variables to restyle everything
═══════════════════════════════════════════════════════════════ */
:root {
  /* ── Canvas ──────────────────────────────────────── */
  --gsp-bg:              #0c0b0f;
  --gsp-canvas-bg:       #0f0e12;

  /* ── Typography ──────────────────────────────────── */
  --gsp-font-display:    'Cormorant Garamond', Georgia, serif;
  --gsp-font-mono:       'DM Mono', 'Courier New', monospace;
  --gsp-text-primary:    rgba(240,236,228,0.92);
  --gsp-text-secondary:  rgba(200,195,185,0.65);
  --gsp-text-muted:      rgba(170,165,155,0.40);

  /* ── Controls ────────────────────────────────────── */
  --gsp-ctrl-bg:         rgba(255,255,255,0.04);
  --gsp-ctrl-border:     rgba(255,255,255,0.10);
  --gsp-ctrl-hover:      rgba(255,255,255,0.08);
  --gsp-ctrl-active-bg:  rgba(255,255,255,0.12);
  --gsp-ctrl-active-bdr: rgba(255,255,255,0.30);
  --gsp-ctrl-radius:     6px;

  /* ── Chips ───────────────────────────────────────── */
  --gsp-chip-radius:     10px;
  --gsp-chip-border:     rgba(255,255,255,0.08);
  --gsp-chip-height:     88px;

  /* ── Showcase ────────────────────────────────────── */
  --gsp-showcase-row-h:  120px;  /* ← scale rows here */
  --gsp-showcase-gap:    5px;
  --gsp-showcase-radius: 12px;

  /* ── Layout ──────────────────────────────────────── */
  --gsp-gap:             8px;
  --gsp-section-gap:     1.4rem;
  --gsp-max-width:       940px;
  --gsp-padding:         2rem 1.5rem;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--gsp-bg);
  color: var(--gsp-text-primary);
  font-family: var(--gsp-font-mono);
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: var(--gsp-padding);
}
.gsp-widget { width: 100%; max-width: var(--gsp-max-width); }

/* ── Header ──────────────────────────────────────────────── */
.gsp-header {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 1.4rem; flex-wrap: wrap; gap: 1rem;
}
.gsp-title { font-family: var(--gsp-font-display); font-weight: 300; font-size: clamp(1.4rem,4vw,2rem); letter-spacing: 0.02em; }
.gsp-title em { font-style: italic; opacity: 0.65; }
.gsp-phi-badge { font-family: var(--gsp-font-display); font-size: 1.6rem; font-weight: 300; color: var(--gsp-text-muted); }

/* Way back out to the other tool and the portfolio this is shown from. */
.gsp-nav { font-size: 10.5px; color: var(--gsp-text-muted); letter-spacing: 0.05em; margin-top: 4px; }
.gsp-nav a { color: inherit; text-underline-offset: .2em; }
.gsp-nav a:hover { color: var(--gsp-text-secondary); }

/* ── Controls ────────────────────────────────────────────── */
.gsp-controls { display: flex; gap: var(--gsp-gap); align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
.gsp-label { font-size: 11px; color: var(--gsp-text-secondary); letter-spacing: 0.08em; text-transform: uppercase; }
.gsp-color-wrap { position: relative; width: 32px; height: 26px; }
.gsp-color-wrap input[type="color"] { opacity: 0; position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; border: none; }
.gsp-color-swatch { position: absolute; inset: 0; border-radius: var(--gsp-ctrl-radius); border: 1px solid var(--gsp-ctrl-border); pointer-events: none; transition: background 0.2s; }
.gsp-hue-label { font-size: 11px; color: var(--gsp-text-muted); min-width: 108px; }
.gsp-btn { font-family: var(--gsp-font-mono); font-size: 12px; color: var(--gsp-text-secondary); background: var(--gsp-ctrl-bg); border: 1px solid var(--gsp-ctrl-border); border-radius: var(--gsp-ctrl-radius); padding: 5px 12px; cursor: pointer; transition: background .15s,color .15s,border-color .15s; letter-spacing: 0.04em; }
.gsp-btn:hover { background: var(--gsp-ctrl-hover); color: var(--gsp-text-primary); border-color: var(--gsp-ctrl-active-bdr); }
.gsp-btn.active { background: var(--gsp-ctrl-active-bg); color: var(--gsp-text-primary); border-color: var(--gsp-ctrl-active-bdr); }
.gsp-sep { width: 1px; height: 18px; background: var(--gsp-ctrl-border); flex-shrink: 0; }
.gsp-mode-note { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: var(--gsp-text-muted); letter-spacing: 0.04em; padding: 3px 9px; border: 1px solid var(--gsp-ctrl-border); border-radius: 20px; }
.gsp-mode-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.6; }
.gsp-schemes { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 1rem; }

/* ── Canvas ──────────────────────────────────────────────── */
.gsp-canvas-wrap { border-radius: 12px; overflow: hidden; border: 1px solid var(--gsp-ctrl-border); margin-bottom: 1.2rem; background: var(--gsp-canvas-bg); }
.gsp-canvas-wrap canvas { display: block; width: 100%; height: auto; }

/* ═══════════════════════════════════════════════════════════
   SHOWCASE — scalable φ-proportioned middle section
   Rows grow as the widget widens. Each row is 1/φ the height
   of the row above it. Panels use φ flex ratios.
═══════════════════════════════════════════════════════════ */
.gsp-showcase-wrap { margin-bottom: 1.4rem; }
.gsp-showcase-label { font-size: 11px; color: var(--gsp-text-muted); letter-spacing: 0.10em; text-transform: uppercase; margin-bottom: 8px; }

/* The grid container */
.gsp-showcase {
  display: flex;
  flex-direction: column;
  gap: var(--gsp-showcase-gap);
  border-radius: var(--gsp-showcase-radius);
  overflow: hidden;
}

/* Each row */
.gsp-sc-row {
  display: flex;
  gap: var(--gsp-showcase-gap);
}

/* Row heights scale by 1/φ — set via JS inline style */
/* Panel flex sizes follow φ ratios */
.gsp-sc-panel {
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 12px 14px; cursor: pointer; position: relative; overflow: hidden;
  transition: filter 0.18s, transform 0.15s;
  min-width: 0;
}
.gsp-sc-panel:hover { filter: brightness(1.08); transform: scale(1.012); z-index: 1; }
.gsp-sc-panel.copied::after {
  content: 'copied';
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; letter-spacing: 0.08em;
  background: rgba(0,0,0,0.30); backdrop-filter: blur(3px);
}
.gsp-sc-panel .sc-role { font-family: var(--gsp-font-display); font-size: 0.82rem; font-weight: 300; letter-spacing: 0.07em; text-transform: uppercase; opacity: 0.70; line-height: 1; margin-bottom: 3px; }
.gsp-sc-panel .sc-hex  { font-family: var(--gsp-font-mono); font-size: 9px; opacity: 0.45; letter-spacing: 0.3px; }
.gsp-sc-panel .sc-name { font-size: 9.5px; opacity: 0.35; letter-spacing: 0.04em; margin-bottom: 2px; }

/* Iteration strip */
.gsp-iter-strip { display: flex; gap: var(--gsp-showcase-gap); margin-top: var(--gsp-showcase-gap); height: 48px; }
.gsp-iter-chip { flex: 1; border-radius: 8px; display: flex; align-items: flex-end; padding: 5px 8px; cursor: pointer; border: 0.5px solid rgba(255,255,255,0.06); transition: transform 0.13s; overflow: hidden; }
.gsp-iter-chip:hover { transform: translateY(-2px); }
.gsp-iter-chip.active { border: 1.5px solid rgba(255,255,255,0.50) !important; }
.gsp-iter-chip .ic-label { font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.65; }
.gsp-iter-chip .ic-step  { font-size: 9px; opacity: 0.30; margin-left: 5px; }

/* ── Story bar ───────────────────────────────────────────── */
.gsp-story { display: flex; gap: 4px; margin-bottom: 1.2rem; }
.gsp-story-chip { flex: 1; height: 52px; border-radius: 8px; display: flex; align-items: flex-end; padding: 6px 8px; cursor: pointer; min-width: 44px; border: 0.5px solid rgba(255,255,255,0.08); transition: transform 0.13s; }
.gsp-story-chip:hover { transform: translateY(-2px); }
.gsp-story-label { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.72; white-space: nowrap; overflow: hidden; }

/* ── Palette chips ───────────────────────────────────────── */
.gsp-palette-section { margin-bottom: var(--gsp-section-gap); }
.gsp-section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.gsp-section-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 0.5px solid rgba(255,255,255,0.1); }
.gsp-section-name { font-family: var(--gsp-font-display); font-size: 1rem; font-weight: 400; letter-spacing: 0.04em; }
.gsp-section-desc { font-size: 11px; color: var(--gsp-text-muted); letter-spacing: 0.03em; }
.gsp-chips-row { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; scrollbar-color: var(--gsp-ctrl-border) transparent; }
.gsp-chip { flex: 1; min-width: 62px; height: var(--gsp-chip-height); border-radius: var(--gsp-chip-radius); padding: 8px 9px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; border: 0.5px solid var(--gsp-chip-border); transition: transform .13s ease,border-color .13s; position: relative; overflow: hidden; flex-shrink: 0; }
.gsp-chip:hover { transform: translateY(-3px) scale(1.03); border-color: rgba(255,255,255,0.25); z-index: 1; }
.gsp-chip.copied::after { content: 'copied'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: 0.06em; background: rgba(0,0,0,0.35); backdrop-filter: blur(2px); }
.gsp-chip-top  { font-size: 11px; font-weight: 600; letter-spacing: 0.02em; opacity: 0.8; }
.gsp-chip-hex  { font-family: var(--gsp-font-mono); font-size: 9.5px; letter-spacing: 0.3px; opacity: 0.85; }
.gsp-chip-role { font-size: 9px; opacity: 0.45; margin-top: 1px; }

/* ── Footer ──────────────────────────────────────────────── */
.gsp-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--gsp-ctrl-border); flex-wrap: wrap; gap: 8px; }
.gsp-footer-note { font-size: 10px; color: var(--gsp-text-muted); letter-spacing: 0.05em; line-height: 1.7; }
.gsp-css-btn { font-family: var(--gsp-font-mono); font-size: 11px; color: var(--gsp-text-muted); background: transparent; border: 1px solid var(--gsp-ctrl-border); border-radius: var(--gsp-ctrl-radius); padding: 5px 12px; cursor: pointer; letter-spacing: 0.05em; transition: all 0.15s; }
.gsp-css-btn:hover { color: var(--gsp-text-primary); border-color: var(--gsp-ctrl-active-bdr); }

@media (max-width: 560px) {
  :root { --gsp-chip-height: 76px; --gsp-padding: 1.2rem 1rem; --gsp-showcase-row-h: 90px; }
  .gsp-chip { min-width: 50px; }
  .gsp-chip-role, .gsp-sc-panel .sc-hex { display: none; }
}

/* The reveal is the point of the piece, so when motion is unwelcome the
   finished figure is drawn once instead of not at all. */
@media (prefers-reduced-motion: reduce) {
  .gsp-sc-panel, .gsp-chip, .gsp-story-chip, .gsp-iter-chip { transition: none; }
}
</style>
</head>
<body>
<div class="gsp-widget" id="gsp">
  <header class="gsp-header">
    <div>
      <h1 class="gsp-title">Golden Section <em>Palette</em></h1>
      <nav class="gsp-nav">
        <a href="wheel.html">Colour Theory Wheel</a> ·
        <a href="/">Virginia P. Payson</a>
      </nav>
    </div>
    <span class="gsp-phi-badge">φ</span>
  </header>

  <div class="gsp-canvas-wrap"><canvas id="gsp-canvas"></canvas></div>

  <div class="gsp-controls">
    <span class="gsp-label">Color</span>
    <div class="gsp-color-wrap">
      <input type="color" id="gsp-cp" title="Choose base color" />
      <div class="gsp-color-swatch" id="gsp-swatch"></div>
    </div>
    <span class="gsp-hue-label" id="gsp-hlbl"></span>
    <div class="gsp-sep"></div>
    <button class="gsp-btn" id="gsp-rnd">Randomize ↗</button>
    <button class="gsp-btn" id="gsp-iterate">Iterate +30°</button>
    <div class="gsp-sep"></div>
    <div class="gsp-mode-note"><span class="gsp-mode-dot"></span><span id="gsp-modetext">fixed</span></div>
  </div>

  <div class="gsp-schemes" id="gsp-schemes"></div>

  <div class="gsp-showcase-wrap">
    <p class="gsp-showcase-label">Color story — φ proportions</p>
    <div class="gsp-showcase" id="gsp-showcase"></div>
    <div class="gsp-iter-strip" id="gsp-iter-strip"></div>
  </div>

  <div class="gsp-story" id="gsp-story"></div>
  <div id="gsp-palette"></div>

  <footer class="gsp-footer">
    <p class="gsp-footer-note">
      Color wheel governs hue · φ governs proportion · OKLCH color science<br>
      Click any swatch to copy its hex value
    </p>
    <button class="gsp-css-btn" id="gsp-css">Export CSS vars</button>
  </footer>
</div>

<script>
(function () {
  'use strict';

  const PHI = (1 + Math.sqrt(5)) / 2;

  /* ── OKLCH ──────────────────────────────────────────────── */
  function oklch(L, C, H) {
    L = Math.max(0, Math.min(1, L)); C = Math.max(0, C);
    const hr = H * Math.PI / 180, a = C * Math.cos(hr), b = C * Math.sin(hr);
    const l_ = L+0.3963377774*a+0.2158037573*b;
    const m_ = L-0.1055613458*a-0.0638541728*b;
    const s_ = L-0.0894841775*a-1.2914855480*b;
    const lv=l_*l_*l_, mv=m_*m_*m_, sv=s_*s_*s_;
    let R= 4.0767416621*lv-3.3077115913*mv+0.2309699292*sv;
    let G=-1.2684380046*lv+2.6097574011*mv-0.3413193965*sv;
    let B=-0.0041960863*lv-0.7034186147*mv+1.7076147010*sv;
    const gc=x=>x<=0.0031308?12.92*x:1.055*Math.pow(Math.max(0,x),1/2.4)-0.055;
    const hx=x=>Math.round(Math.max(0,Math.min(1,gc(x)))*255).toString(16).padStart(2,'0');
    return'#'+hx(R)+hx(G)+hx(B);
  }

  function hexToOklch(hex) {
    const p=s=>parseInt(s,16)/255;
    let r=p(hex.slice(1,3)),g=p(hex.slice(3,5)),b=p(hex.slice(5,7));
    const gd=x=>x<=0.04045?x/12.92:Math.pow((x+0.055)/1.055,2.4);
    r=gd(r);g=gd(g);b=gd(b);
    const l=0.4122214708*r+0.5363325363*g+0.0514459929*b;
    const m=0.2119034982*r+0.6806995451*g+0.1073969566*b;
    const s=0.0883024619*r+0.2817188376*g+0.6299787005*b;
    const l_=Math.cbrt(l),m_=Math.cbrt(m),s_=Math.cbrt(s);
    const a =1.9779984951*l_-2.4285922050*m_+0.4505937099*s_;
    const bv=0.0259040371*l_+0.7827717662*m_-0.8086757660*s_;
    const Lo=0.2104542553*l_+0.7936177850*m_-0.0040720468*s_;
    return{L:Lo, C:Math.sqrt(a*a+bv*bv), H:((Math.atan2(bv,a)*180/Math.PI)+360)%360};
  }

  function isLight(hex) {
    const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
    return(0.299*r+0.587*g+0.114*b)>0.55;
  }

  function randomHex() {
    return oklch(0.38+Math.random()*0.40, 0.09+Math.random()*0.16, Math.random()*360);
  }

  /* ── Tonal family — anchored to picked L ─────────────────── */
  const BASE_STEPS = [
    {name:'100',L:0.965,cScale:0.15,role:'White base'},
    {name:'200',L:0.890,cScale:0.35,role:'Tint'},
    {name:'300',L:0.790,cScale:0.58,role:'Light'},
    {name:'400',L:0.690,cScale:0.80,role:'Mid-light'},
    {name:'500',L:0.590,cScale:1.00,role:'True ★'},
    {name:'600',L:0.480,cScale:0.82,role:'Tone'},
    {name:'700',L:0.370,cScale:0.65,role:'Shade'},
    {name:'800',L:0.255,cScale:0.45,role:'Dark'},
    {name:'900',L:0.145,cScale:0.22,role:'Deep'},
  ];

  function buildFamily(H, maxC, anchorL, label, sub) {
    const shift = anchorL - 0.590;
    const steps = BASE_STEPS.map(s=>({...s, L:Math.max(0.04,Math.min(0.97,s.L+shift))}));
    return { label, sub, H,
      chips: steps.map(s=>{
        const hex=oklch(s.L,maxC*s.cScale,H);
        return{...s,hex,H,C:maxC*s.cScale,ink:isLight(hex)?'#1a1a1e':'#f2ede6'};
      })
    };
  }

  /* ── Harmony schemes ──────────────────────────────────────── */
  const SCHEMES=[
    {id:'mono',   label:'Monochromatic', offset:0,   sub:'Single hue, full tonal arc'},
    {id:'anal',   label:'Analogous',     offset:30,  sub:'Adjacent 30° — warm companion'},
    {id:'comp',   label:'Complementary', offset:180, sub:'Opposite 180° — contrast anchor'},
    {id:'split',  label:'Split Comp.',   offset:150, sub:'150° — softened complement'},
    {id:'triad',  label:'Triad',         offset:120, sub:'120° — balanced third voice'},
    {id:'tetrad', label:'Tetrad',        offset:90,  sub:'90° rectangle — broadest range'},
    {id:'key',    label:'Key Color',     offset:0,   sub:'One dominant, all others recede'},
  ];

  function buildPalette(H, maxC, anchorL, schemeId) {
    const s=SCHEMES.find(x=>x.id===schemeId)||SCHEMES[2];
    const defs=[{label:'Dominant',sub:'Primary color story',offset:0}];
    if(schemeId!=='mono'&&schemeId!=='key'){
      defs.push({label:s.label,sub:s.sub,offset:s.offset});
      if(schemeId==='split')  defs.push({label:'Split (2)', sub:'H + 210°',offset:210});
      if(schemeId==='triad')  defs.push({label:'Triad (2)', sub:'H + 240°',offset:240});
      if(schemeId==='tetrad'){
        defs.push({label:'Tetrad (2)',sub:'H + 180°',offset:180});
        defs.push({label:'Tetrad (3)',sub:'H + 270°',offset:270});
      }
    }
    return defs.map(d=>buildFamily((H+d.offset)%360,maxC,anchorL,d.label,d.sub));
  }

  /* ── Canvas spiral ────────────────────────────────────────── */
  const canvas=document.getElementById('gsp-canvas');
  const ctx=canvas.getContext('2d');
  const CW=800,CH=Math.round(CW/PHI);
  canvas.width=CW; canvas.height=CH;

  function buildSquares(){
    const D=['right','top','left','bottom'];
    const out=[];let x=0,y=0,w=CW,h=CH;
    for(let i=0;i<13;i++){
      const sq=w>=h?h:w;if(sq<2)break;
      const d=D[i%4];let sx,sy;
      if(d==='right'){sx=x+w-sq;sy=y;w-=sq;}
      else if(d==='top'){sx=x;sy=y;y+=sq;h-=sq;}
      else if(d==='left'){sx=x;sy=y;x+=sq;w-=sq;}
      else{sx=x;sy=y+h-sq;h-=sq;}
      out.push({sx,sy,sq,d});
    }
    return out;
  }

  function arcOf(s){
    const{sx,sy,sq,d}=s;
    if(d==='right')return{cx:sx,     cy:sy+sq,r:sq,sa:-Math.PI/2, ea:0           };
    if(d==='top')  return{cx:sx+sq,  cy:sy+sq,r:sq,sa:Math.PI,    ea:Math.PI*1.5 };
    if(d==='left') return{cx:sx+sq,  cy:sy,   r:sq,sa:Math.PI*.5, ea:Math.PI     };
    return              {cx:sx,      cy:sy,   r:sq,sa:0,           ea:Math.PI*.5  };
  }

  const SQ=buildSquares(),N=SQ.length;
  const REDUCED = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let spiralColors=[];
  let step=0,prog=0,sp=0,phase='sq',raf=null,prevT=null;
  function ease(t){return t<.5?2*t*t:-1+(4-2*t)*t;}

  function drawSpiral(){
    ctx.clearRect(0,0,CW,CH);ctx.fillStyle='#0f0e12';ctx.fillRect(0,0,CW,CH);
    for(let i=0;i<step;i++){const s=SQ[i];ctx.fillStyle=spiralColors[i];ctx.fillRect(s.sx,s.sy,s.sq,s.sq);}
    if(phase==='sq'&&step<N){
      const s=SQ[step],a=arcOf(s),r=s.sq*1.415*ease(prog);
      ctx.save();ctx.beginPath();ctx.arc(a.cx,a.cy,r,0,Math.PI*2);ctx.clip();
      ctx.fillStyle=spiralColors[step];ctx.fillRect(s.sx,s.sy,s.sq,s.sq);ctx.restore();
    }
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=0.5;
    const show=Math.min(step+(phase==='sq'?1:0),N);
    for(let i=0;i<show;i++){const s=SQ[i];ctx.strokeRect(s.sx+.25,s.sy+.25,s.sq-.5,s.sq-.5);}
    if(sp>0){
      ctx.strokeStyle='rgba(255,255,255,0.92)';ctx.lineWidth=2.5;ctx.lineCap='round';
      const full=Math.min(Math.floor(sp),N),frac=sp-full;
      for(let i=0;i<full;i++){const a=arcOf(SQ[i]);ctx.beginPath();ctx.arc(a.cx,a.cy,a.r,a.sa,a.ea,false);ctx.stroke();}
      if(full<N){const a=arcOf(SQ[full]);ctx.beginPath();ctx.arc(a.cx,a.cy,a.r,a.sa,a.sa+(a.ea-a.sa)*frac,false);ctx.stroke();}
    }
  }

  function tick(t){
    if(prevT===null)prevT=t;
    const dt=Math.min(t-prevT,50);prevT=t;
    if(phase==='sq'){
      const dur=Math.max(140,SQ[step].sq*.50+80);
      prog+=dt/dur;if(prog>=1){prog=0;step++;if(step>=N)phase='spiral';}
    }else if(phase==='spiral'){sp+=dt/165;if(sp>=N){sp=N;phase='done';}}
    drawSpiral();
    if(phase!=='done')raf=requestAnimationFrame(tick);
  }

  function startAnim(cols){
    cancelAnimationFrame(raf);
    spiralColors=cols;step=0;prog=0;sp=0;phase='sq';prevT=null;
    if(REDUCED){
      // Straight to the finished figure — no reveal, but nothing missing.
      step=N;sp=N;phase='done';drawSpiral();return;
    }
    raf=requestAnimationFrame(tick);
  }

  /* ── State ────────────────────────────────────────────────── */
  let baseHex   = randomHex();
  let schemeId  = 'comp';
  let analogStep = 0;
  let colorMode  = 'random';
  let palette    = [];
  let widgetW    = 0;

  /* ── Size-aware tonal tiers ───────────────────────────────────
     Squares are assigned tonal levels based on their actual size
     relative to the largest square (SQ[0].sq).

     LARGE  (top ~3 squares, relSize > 0.30):
       Bold, rich, high-chroma — these own the composition.
       Pattern alternates deep darks and true/mid tones.

     MEDIUM (mid ~3 squares, relSize 0.09–0.30):
       Supporting cast — tone and shade range, still present
       but not competing with the large squares.

     SMALL  (inner ~7 squares, relSize < 0.09):
       Light tints and near-whites — they frame the drama,
       give the eye somewhere to rest, and make the bold
       squares pop by contrast.

     COMPLEMENTARY gets strict alternation — every square
     flips between dominant and complement family, creating
     the push-pull tension the scheme is built for.
  ──────────────────────────────────────────────────────────── */
  //                    True  Dark  Tone  Deep  Shade Mid
  const TIER_LARGE  = [  4,    7,    5,    8,    6,   3  ];
  //                    Tone  Mid   Shade True  Dark  Tone
  const TIER_MEDIUM = [  5,    3,    6,    4,    7,   5  ];
  //                    Tint  Light WBase Tint  Light
  const TIER_SMALL  = [  1,    2,    0,    1,    2  ];

  /* ── Main render ──────────────────────────────────────────── */
  function render(){
    const{H,C:bC,L:bL}=hexToOklch(baseHex);
    // Spiral gets a chroma boost — at least 0.16 so even muted
    // picks render with confidence. Cap at 0.26 to stay tasteful.
    const spiralC  = Math.min(0.26, Math.max(bC * 1.25, 0.16));
    const paletteC = Math.max(bC, 0.09);
    const iterH=(H+analogStep*30)%360;
    palette=buildPalette(iterH,paletteC,bL,schemeId);

    // Bold-chroma families for spiral only
    const boldFamilies = buildPalette(iterH, spiralC, bL, schemeId);
    const nFam = Math.max(1, boldFamilies.length);
    const largestSq = SQ[0].sq;
    const isComp = schemeId === 'comp' && nFam >= 2;

    const cols=[];
    for(let i=0;i<N;i++){
      const relSize = SQ[i].sq / largestSq;

      // ── Tonal tier based on square size ──────────────────
      let tIdx;
      if(relSize > 0.30){
        // Large: bold, alternating deep/true for contrast
        tIdx = TIER_LARGE[i % TIER_LARGE.length];
      } else if(relSize > 0.09){
        // Medium: supporting mid-tones
        tIdx = TIER_MEDIUM[i % TIER_MEDIUM.length];
      } else {
        // Small: light tints — frame the bold squares
        tIdx = TIER_SMALL[i % TIER_SMALL.length];
      }

      // ── Family assignment ─────────────────────────────────
      let fIdx;
      if(isComp){
        // Complementary: strict alternation every square
        // creates the push-pull tension: dom/comp/dom/comp…
        // On large squares, go deeper into each family
        // (offset by 1 for the complement so darks contrast bolds)
        if(relSize > 0.30 && i % 2 === 1){
          // Complement large square: force to deep/shade for drama
          tIdx = i % 4 === 1 ? 7 : 8; // Dark or Deep
        }
        fIdx = i % 2;
      } else {
        // Other schemes: anchor 2 largest to dominant,
        // then cycle families for hue variety
        fIdx = i < 2 ? 0 : (i % nFam);
      }

      cols.push(boldFamilies[fIdx].chips[tIdx].hex);
    }
    startAnim(cols);
    renderSchemes();
    renderShowcase(iterH,paletteC,bL);
    renderStory();
    renderPalette();
    updateControls(iterH,bL,bC);
  }

  /* ── Scheme buttons ───────────────────────────────────────── */
  function renderSchemes(){
    const bar=document.getElementById('gsp-schemes');bar.innerHTML='';
    SCHEMES.forEach(s=>{
      const b=document.createElement('button');
      b.className='gsp-btn'+(s.id===schemeId?' active':'');
      b.textContent=s.label;b.style.fontSize='11px';
      b.addEventListener('click',()=>{schemeId=s.id;render();});
      bar.appendChild(b);
    });
  }

  /* ══════════════════════════════════════════════════════════
     SHOWCASE — scalable
     Row count depends on widgetW:
       < 500px  → 1 row
       < 700px  → 2 rows  (default)
       < 900px  → 3 rows
       ≥ 900px  → 4 rows

     Row height stays fixed (--gsp-showcase-row-h).
     Each row is 1/φ the HEIGHT of the row above it so the
     total grows gracefully — edit just one CSS variable.

     LAST 2 PANELS of row 1 are always the next harmonic hue
     at Light (300) and True (500) — so the dominant family
     literally walks into the companion colour.
  ══════════════════════════════════════════════════════════ */
  function renderShowcase(iterH, maxC, anchorL){
    const sc  = document.getElementById('gsp-showcase');
    const itr = document.getElementById('gsp-iter-strip');
    sc.innerHTML=''; itr.innerHTML='';

    const rowH = parseInt(getComputedStyle(document.documentElement)
      .getPropertyValue('--gsp-showcase-row-h')) || 120;
    const gap  = parseInt(getComputedStyle(document.documentElement)
      .getPropertyValue('--gsp-showcase-gap')) || 5;

    const nRows = widgetW < 500 ? 1
                : widgetW < 700 ? 2
                : widgetW < 900 ? 3
                : 4;

    // row heights: row[0] = rowH, row[1] = rowH/φ, row[2] = rowH/φ², …
    const rh = i => Math.round(rowH / Math.pow(PHI, i));

    // Pull families (fall back to dom if not enough)
    const dom  = palette[0];
    const sec  = palette[1] || palette[0];
    const acc  = palette[2] || palette[1] || palette[0];
    const quat = palette[3] || palette[2] || palette[1] || palette[0];

    // Convenient chip shortcuts
    const c = (fam, idx) => fam.chips[idx];

    /* ── Row definitions ─────────────────────────────────────
       Each row is an array of panel defs: {hex, ink, role, name, flex}
       flex follows φ ratios: xl=φ, lg=1, md=1/φ, sm=1/φ²
    ──────────────────────────────────────────────────────── */
    const rows = [
      // Row 0 — dominant story + walk into next hue
      [
        {chip:c(dom,4), role:'Feature',    flex: PHI},           // dom True (dominant hero)
        {chip:c(dom,2), role:'Primary',    flex: 1},             // dom Light
        {chip:c(sec,2), role:'Next · Light', flex: 1/PHI},       // ← next hue Light (300)
        {chip:c(sec,4), role:'Next · True',  flex: 1/(PHI*PHI)}, // ← next hue True (500)
      ],
      // Row 1 — tonal depth + accent
      [
        {chip:c(dom,7), role:'Anchor',     flex: 1/PHI},
        {chip:c(dom,1), role:'Tint',       flex: 1},
        {chip:c(acc,4), role:'Accent',     flex: PHI},
        {chip:c(dom,6), role:'Tone',       flex: 1/PHI},
      ],
      // Row 2 — third harmonic family preview
      [
        {chip:c(acc,2), role:'Accent Light',  flex: 1},
        {chip:c(acc,3), role:'Accent Mid',    flex: PHI},
        {chip:c(dom,0), role:'White Base',    flex: 1/PHI},
        {chip:c(acc,6), role:'Accent Shade',  flex: 1/(PHI*PHI)},
      ],
      // Row 3 — fourth harmonic or deep exploration
      [
        {chip:c(quat,3), role:'Quartet Mid',  flex: PHI},
        {chip:c(dom,8),  role:'Deep',         flex: 1},
        {chip:c(quat,5), role:'Quartet Tone', flex: 1/PHI},
        {chip:c(quat,1), role:'Quartet Tint', flex: 1},
      ],
    ];

    for(let r=0; r<nRows; r++){
      const row = document.createElement('div');
      row.className='gsp-sc-row';
      row.style.height = rh(r) + 'px';
      row.style.flexShrink = '0';

      rows[r].forEach(pd=>{
        const {chip, role, flex} = pd;
        const p = document.createElement('div');
        p.className='gsp-sc-panel';
        p.style.cssText=`background:${chip.hex};flex:${flex.toFixed(4)};`;
        // Show family name label on taller rows
        const showName = rh(r) > 80;
        p.innerHTML=`
          ${showName?`<span class="sc-name" style="color:${chip.ink};">${chip.role}</span>`:''}
          <span class="sc-role" style="color:${chip.ink};">${role}</span>
          <span class="sc-hex"  style="color:${chip.ink};">${chip.hex}</span>`;
        p.title='Click to copy '+chip.hex;
        p.addEventListener('click',()=>copyAndFlash(chip.hex,p));
        row.appendChild(p);
      });
      sc.appendChild(row);
    }

    /* ── Iteration strip ────────────────────────────────── */
    const nStrips = Math.min(12, Math.max(4, Math.floor(widgetW / 60)));
    for(let s=0; s<nStrips; s++){
      const iH=(iterH+s*30)%360;
      const hex=oklch(anchorL,maxC,iH);
      const ink=isLight(hex)?'#1a1a1e':'#f2ede6';
      const chip=document.createElement('div');
      chip.className='gsp-iter-chip'+(s===analogStep%nStrips?' active':'');
      chip.style.background=hex;
      chip.innerHTML=`<span class="ic-label" style="color:${ink};">+${s*30}°</span><span class="ic-step" style="color:${ink};">v${s+1}</span>`;
      chip.title=hex+' — click to use as base';
      chip.addEventListener('click',()=>{
        baseHex=hex; analogStep=0; colorMode='fixed'; render();
      });
      itr.appendChild(chip);
    }
  }

  /* ── Story bar ────────────────────────────────────────────── */
  function renderStory(){
    const el=document.getElementById('gsp-story');el.innerHTML='';
    const roles=[1,3,4,6,8];
    palette.forEach((fam,fi)=>{
      const c=fam.chips[roles[Math.min(fi,roles.length-1)]];
      const ink=isLight(c.hex)?'#1a1a1e':'#f2ede6';
      const d=document.createElement('div');
      d.className='gsp-story-chip';d.style.background=c.hex;
      d.innerHTML=`<span class="gsp-story-label" style="color:${ink};">${fam.label}</span>`;
      d.title=c.hex;
      d.addEventListener('click',()=>copyAndFlash(c.hex,d));
      el.appendChild(d);
    });
  }

  /* ── Palette grid ─────────────────────────────────────────── */
  function renderPalette(){
    const root=document.getElementById('gsp-palette');root.innerHTML='';
    palette.forEach(fam=>{
      const sec=document.createElement('div');sec.className='gsp-palette-section';
      const hdr=document.createElement('div');hdr.className='gsp-section-header';
      const dot=document.createElement('div');dot.className='gsp-section-dot';dot.style.background=fam.chips[4].hex;
      hdr.appendChild(dot);
      const nm=document.createElement('span');nm.className='gsp-section-name';nm.textContent=fam.label;hdr.appendChild(nm);
      const ds=document.createElement('span');ds.className='gsp-section-desc';ds.textContent=fam.sub;hdr.appendChild(ds);
      sec.appendChild(hdr);
      const row=document.createElement('div');row.className='gsp-chips-row';
      fam.chips.forEach(c=>{
        const chip=document.createElement('div');chip.className='gsp-chip';chip.style.background=c.hex;
        chip.innerHTML=`<span class="gsp-chip-top" style="color:${c.ink};">${c.name}</span><div><div class="gsp-chip-hex" style="color:${c.ink};">${c.hex}</div><div class="gsp-chip-role" style="color:${c.ink};">${c.role}</div></div>`;
        chip.title='Click to copy '+c.hex;
        chip.addEventListener('click',()=>copyAndFlash(c.hex,chip));
        row.appendChild(chip);
      });
      sec.appendChild(row);root.appendChild(sec);
    });
  }

  /* ── Controls ─────────────────────────────────────────────── */
  function updateControls(iterH,bL,bC){
    document.getElementById('gsp-swatch').style.background=baseHex;
    document.getElementById('gsp-cp').value=baseHex;
    document.getElementById('gsp-hlbl').textContent='H '+Math.round(iterH)+'°  L '+Math.round(bL*100)+'  C '+bC.toFixed(2);
    document.getElementById('gsp-modetext').textContent=colorMode==='analogous'?'analogous · step '+analogStep:colorMode;
  }

  /* ── Copy ─────────────────────────────────────────────────── */
  function copyAndFlash(text,el){
    navigator.clipboard.writeText(text).catch(()=>{});
    el.classList.add('copied');setTimeout(()=>el.classList.remove('copied'),900);
  }

  /* ── CSS export ───────────────────────────────────────────── */
  function exportCSS(){
    const lines=['/* Golden Section Palette — OKLCH */\n:root {'];
    palette.forEach(fam=>{
      lines.push('\n  /* '+fam.label+' H '+Math.round(fam.H)+'° */');
      fam.chips.forEach(c=>{
        const n='--'+fam.label.toLowerCase().replace(/[\s()\/]+/g,'-')+'-'+c.name;
        lines.push('  '+n+': '+c.hex+'; /* '+c.role+' */');
      });
    });
    lines.push('}');
    const btn=document.getElementById('gsp-css');
    navigator.clipboard.writeText(lines.join('\n')).catch(()=>{});
    const orig=btn.textContent;btn.textContent='Copied ✓';
    setTimeout(()=>btn.textContent=orig,1600);
  }

  /* ── ResizeObserver — adds rows as widget widens ────────────
     Watches the widget container. On width change, re-renders
     the showcase with the correct row count. Debounced 80ms.
  ────────────────────────────────────────────────────────── */
  let resizeTimer = null;
  const widget = document.getElementById('gsp');
  const ro = new ResizeObserver(entries => {
    const w = entries[0].contentRect.width;
    if (Math.abs(w - widgetW) > 20) {
      widgetW = w;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const{H,C:bC,L:bL}=hexToOklch(baseHex);
        const iterH=(H+analogStep*30)%360;
        renderShowcase(iterH, Math.max(bC, 0.09), bL);
      }, 80);
    }
  });
  ro.observe(widget);

  /* ── Events ───────────────────────────────────────────────── */
  document.getElementById('gsp-cp').addEventListener('input',e=>{
    baseHex=e.target.value; colorMode='fixed'; analogStep=0; render();
  });
  document.getElementById('gsp-rnd').addEventListener('click',()=>{
    baseHex=randomHex(); colorMode='random'; analogStep=0; render();
  });
  document.getElementById('gsp-iterate').addEventListener('click',()=>{
    colorMode='analogous'; analogStep=(analogStep+1)%12; render();
  });
  document.getElementById('gsp-css').addEventListener('click',exportCSS);

  /* ── Boot ─────────────────────────────────────────────────── */
  widgetW = widget.getBoundingClientRect().width || 600;
  render();
})();
</script>
</body>
</html>
